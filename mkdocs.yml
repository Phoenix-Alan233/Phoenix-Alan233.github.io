# 自定义样式和脚本
extra_css:
  - https://cdn.tonycrane.cc/lxgw/lxgwscreen.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/layout.css
  - assets/stylesheets/card.css
  - assets/stylesheets/rounded-corners.css
  - assets/stylesheets/pdf-viewer.css

extra_javascript:
  - assets/javascripts/extra.js
  # - assets/javascripts/snowflakes.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 主题配置
theme:
  name: material
  language: zh
  custom_dir: overrides  # 主题覆盖目录
  font: false  # 使用本地字体，不请求 Google Fonts
  icon:
    repo: fontawesome/brands/github
  palette:
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: 切换至浅色模式
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/lightbulb
        name: 切换至深色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky  # 导航栏固定
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer  # 页脚导航
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select

# 插件
plugins:
  - search:
      lang:
        - zh
        - en

# 确保 PDF 文件被复制
exclude_docs: |
  *.tmp

# Hooks
hooks:
  - hooks/pdf_embed.py

# Markdown 扩展
markdown_extensions:
  - attr_list
  - admonition
  - tables
  - md_in_html
  - toc:
      permalink: ⚓︎
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

# 额外配置
extra:
  generator: false  # 隐藏"Made with Material for MkDocs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Phoenix-Alan233
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:wlzhouzhuan@gmail.com
      name: Email