site_name: Alan233 的小站
site_url: https://phoenix-alan233.github.io/
site_author: Alan

# Repository
repo_name: Phoenix-Alan233/Phoenix-Alan233.github.io
repo_url: https://github.com/Phoenix-Alan233/Phoenix-Alan233.github.io

# 自定义样式和脚本
extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/rounded-corners.css
  - assets/stylesheets/pdf-viewer.css

extra_javascript:
  - assets/javascripts/extra.js
  # - assets/javascripts/snowflakes.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 主题配置
theme:
  name: material
  language: zh
  custom_dir: overrides  # 主题覆盖目录
  font:
    text: Ubuntu        # 正文字体
    code: Roboto Mono   # 代码字体
  icon:
    repo: fontawesome/brands/github
  palette:
    # 自动跟随系统主题
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: 切换至深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: 切换至浅色模式
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/lightbulb
        name: 跟随系统主题
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky  # 导航栏固定
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer  # 页脚导航
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select

# 插件
plugins:
  - search:
      lang:
        - zh
        - en

# Markdown 扩展
markdown_extensions:
  - attr_list
  - admonition
  - tables
  - md_in_html
  - toc:
      permalink: ⚓︎
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

# 额外配置
extra:
  generator: false  # 隐藏"Made with Material for MkDocs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Phoenix-Alan233
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:wlzhouzhuan@gmail.com
      name: Email

# 导航结构
nav:
  - 首页: index.md
  - 数学:
    - 高中数学:
      - 圆锥曲线: 数学/圆锥曲线.md
      - 导数: 数学/导数.md
      - 好题分享: 数学/好题分享.md
      - 高考、强基与竞赛: 数学/高考、强基与竞赛.md
  - ACM / ICPC: .md
  - CTF:
    - 学习笔记:
      - 综述: CTF/overall.md
    - 比赛:
      - SHCTF 2026: CTF/SHCTF 2026.md
  - 关于: about.md